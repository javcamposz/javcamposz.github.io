- id: agent-misalignment
  title: "AgentMisalignment: Measuring the Propensity for Misaligned Behaviour in LLM-Based Agents"
  authors: "Francisco Javier Campos Zabala et al."
  venue: "ICLR 2026"
  status: accepted
  date: 2025-06-04
  arxiv: "https://arxiv.org/abs/2506.04018"
  pdf: "/assets/papers/agent-misalignment.pdf"
  summary: >
    A propensity benchmark covering shutdown resistance, oversight evasion,
    sandbagging and power-seeking on frontier models. Key finding: persona
    system prompts shift misalignment more than the choice of model itself,
    with direct implications for how enterprises configure deployed agents.
  tags: [evals, alignment, agents, llm-safety]
  featured: true
